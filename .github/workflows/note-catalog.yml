name: Update note article catalog
on:
  push:
    branches: [main]
    paths: ['notes/**/article.md', 'tools/build-note-catalog.cjs', '.github/workflows/note-catalog.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: note-catalog
  cancel-in-progress: false
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/build-note-catalog.cjs
      - name: Save catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notes/catalog.json
          if ! git diff --cached --quiet; then
            git commit -m "Update note article catalog"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
