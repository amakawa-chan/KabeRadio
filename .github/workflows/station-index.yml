name: station-index

# 「モブ子の放送局」のエピソード索引を自動で再生成する。
# episodes/ の公開記録（publication.json）や site/intros/ の紹介MP3が
# 変わったら、掲載ゲート（publication.json + YouTube oEmbed確認）を
# 通して site/episode-index.json / .js を作り直し、差分があればコミットする。

on:
  push:
    branches:
      - main
      - feature/mobuko-station-proto
    paths:
      - "episodes/**"
      - "site/intros/**"
      - "site/tools/*.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: station-index
  cancel-in-progress: false

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build episode index
        run: python3 site/tools/build_episode_index.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- site/episode-index.json site/episode-index.js; then
            echo "index unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/episode-index.json site/episode-index.js
          git commit -m "放送局：エピソード索引を自動更新"
          git push
